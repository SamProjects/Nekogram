name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      release-tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      publish-telegram: true

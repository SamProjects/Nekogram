name: Build

on:
  push:
    branches: [ "main", "dev", "ci" ]
    paths-ignore:
      - '**.md'
      - '.github/workflows/artifact-cleanup.yml'
      - '.github/workflows/upstream-sync.yml'
  workflow_call:
    inputs:
      release-tag:
        description: Existing tag to publish; empty selects the next release version
        type: string
        default: ''
      publish-telegram:
        description: Publish the release APK to the configured Telegram channel
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: build-and-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37.0 cmake;3.22.1"

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties

      - name: Configure Signing
        run: |
          echo "storeFile=${{ github.workspace }}/keystore.jks" >> local.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties
          
          echo "${{ secrets.KEYSTORE_JKS }}" | base64 --decode > keystore.jks

      - name: Configure Secrets
        run: |
          echo "apiId=${{ secrets.API_ID }}" >> local.properties
          echo "apiHash=${{ secrets.API_HASH }}" >> local.properties
          echo "helperBotId=${{ secrets.HELPER_BOT_ID }}" >> local.properties
          echo "helperBotUsername=${{ secrets.HELPER_BOT_USERNAME }}" >> local.properties
          echo "sentryDsn=${{ secrets.SENTRY_DSN }}" >> local.properties
          echo "mapsApiKey=${{ secrets.MAPS_API_KEY }}" >> local.properties

          echo "${{ secrets.SENTRY_PROPERTIES }}" | base64 --decode > sentry.properties

      - name: Build with Gradle
        run: |
          ./gradlew assembleRelease -PbuildOnlyArm64=true

      - name: Attest
        uses: actions/attest@v4
        with:
          subject-path: '${{ github.workspace }}/TMessagesProj_App/build/outputs/apk/release/*-arm64-v8a.apk'

      - name: Determine release version
        if: inputs.release-tag != '' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
        id: release_version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${REQUESTED_RELEASE_TAG}" ]]; then
            echo "tag=${REQUESTED_RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          base_version="$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties | tr -d '\r' | head -n 1)"
          if [[ -z "${base_version}" ]]; then
            echo "::error::APP_VERSION_NAME was not found in gradle.properties"
            exit 1
          fi

          base_exists=false
          max_suffix=-1
          while IFS= read -r existing_tag; do
            [[ -z "${existing_tag}" ]] && continue
            if [[ "${existing_tag}" == "${base_version}" ]]; then
              base_exists=true
              if (( max_suffix < 0 )); then
                max_suffix=0
              fi
            elif [[ "${existing_tag}" == "${base_version}."* ]]; then
              suffix="${existing_tag#${base_version}.}"
              if [[ "${suffix}" =~ ^[0-9]+$ ]] && (( 10#${suffix} > max_suffix )); then
                max_suffix=$((10#${suffix}))
              fi
            fi
          done < <(
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${base_version}" \
              --jq '.[] | .ref | sub("^refs/tags/"; "")'
          )

          if [[ "${base_exists}" == false && ${max_suffix} -lt 0 ]]; then
            release_tag="${base_version}"
          else
            release_tag="${base_version}.$((max_suffix + 1))"
          fi

          echo "base_version=${base_version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "Release tag: ${release_tag}"

      - name: Publish GitHub Release
        if: inputs.release-tag != '' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            TMessagesProj_App/build/outputs/apk/release/*-arm64-v8a.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "MediaGroupGram ${RELEASE_TAG}" \
            --generate-notes

      - name: Upload to Telegram
        if: inputs.publish-telegram
        uses: nekogram/upload-with-mtcute@e196262c35b722c4c8eac79c835ec6dbd109e4b8
        with:
          api-id: ${{ secrets.API_ID }}
          api-hash: ${{ secrets.API_HASH }}
          bot-token: ${{ secrets.RELEASE_BOT_TOKEN }}
          chat-id: ${{ secrets.RELEASE_CHANNEL_ID }}
          files: TMessagesProj_App/build/outputs/apk/release/*-arm64-v8a.apk
